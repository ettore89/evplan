services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: evplan
      POSTGRES_PASSWORD: evplan
      POSTGRES_DB: evplan
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evplan"]
      interval: 3s
      retries: 20
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://evplan:evplan@db:5432/evplan
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SEED_DEMO: ${SEED_DEMO:-1}
      RECALC_INTERVAL_MINUTES: ${RECALC_INTERVAL_MINUTES:-30}
    ports:
      - "4000:4000"
volumes:
  pgdata:
